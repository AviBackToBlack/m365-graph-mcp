name: Dependency Review

# D53: GitHub-native dependency-diff security gate for proposed changes.
# Read-only; no PR comments or write-scoped GITHUB_TOKEN permissions.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          # Include development tooling and dependencies with unknown scope, not just runtime.
          fail-on-scopes: runtime, development, unknown
          comment-summary-in-pr: never
